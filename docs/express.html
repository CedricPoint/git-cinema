*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060a;overflow:hidden;color:#e8ecf4;font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#05060a}
#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(12,14,22,.78);border:1px solid rgba(255,255,255,.1);border-radius:14px;backdrop-filter:blur(10px);
  transition:opacity .4s;width:min(860px,calc(100vw - 24px))}
#ui.hide{opacity:0;pointer-events:none}
button,select{background:rgba(255,255,255,.08);color:#e8ecf4;border:1px solid rgba(255,255,255,.12);border-radius:9px;
  font:600 13px ui-sans-serif,system-ui,sans-serif;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(255,255,255,.16)}
button.rec{background:#e5484d;border-color:#e5484d}
#bar{flex:1;height:22px;position:relative;cursor:pointer;min-width:60px}
#bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
#fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,#7c5cff,#26d7ff)}
#knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #7c5cffaa}
#msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#e5484d;color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;display:none}
@media (max-width:640px){#ui{flex-wrap:wrap}#bar{order:-1;flex-basis:100%}}

    if (p.parent) { const gx = d.x - p.parent.x, gy = d.y - p.parent.y, gd = Math.hypot(gx, gy) || 1; d.vx += gx / gd * 0.25; d.vy += gy / gd * 0.25; }
    // local repulsion
    const cx = Math.floor(d.x / cell), cy = Math.floor(d.y / cell);
    for (let ix = -1; ix <= 1; ix++) for (let iy = -1; iy <= 1; iy++) {
      const bucket = grid.get((cx + ix) + ',' + (cy + iy)); if (!bucket) continue;
      for (const o of bucket) {
        if (o === d) continue;
        const ex = d.x - o.x, ey = d.y - o.y, e2 = ex * ex + ey * ey + 0.01, min = d.r + o.r + 18;
        if (e2 < min * min * 2.56) { const e = Math.sqrt(e2), push = (min * 1.6 - e) * 0.08; d.vx += ex / e * push; d.vy += ey / e * push; }
      }
    }
  }
  const k = Math.min(1, dt * 60);
  for (const d of list) {
    if (!d.parent) { d.vx = d.vy = 0; continue; }
    d.vx *= 0.82; d.vy *= 0.82;
    d.x += d.vx * k; d.y += d.vy * k;
  }
  for (const a of authors.values()) {
    a.x += (a.tx - a.x) * Math.min(1, dt * 2.2); a.y += (a.ty - a.y) * Math.min(1, dt * 2.2);
  }
}

/* ---------------- camera ---------------- */
const cam = {x: 0, y: 0, z: 1.4};
function updateCamera(dt){
  // frame the bulk of the tree (2nd–98th percentile), not the odd stray branch
  const xs = [], ys = [];
  for (const d of dirs.values()) { if (d.alive) { xs.push(d.x - d.r, d.x + d.r); ys.push(d.y - d.r, d.y + d.r); } }
  if (!xs.length) return;
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.round(p * (arr.length - 1))))];
  const cut = xs.length > 40 ? 0.02 : 0;
  const minX = q(xs, cut), maxX = q(xs, 1 - cut), minY = q(ys, cut), maxY = q(ys, 1 - cut);
  const W = cv.width, H = cv.height, pad = 1.18;
  const z = Math.min(2.2, Math.min(W / ((maxX - minX) * pad + 200), H / ((maxY - minY) * pad + 200)));
  const s = Math.min(1, dt * 1.6);
  cam.x += ((minX + maxX) / 2 - cam.x) * s; cam.y += ((minY + maxY) / 2 - cam.y) * s; cam.z += (z - cam.z) * s;
}

/* ---------------- render ---------------- */
let showLabels = true;
const easeOut = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
function render(now){
  const W = cv.width, H = cv.height, U = H / 1080; // UI scale
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .1, W / 2, H / 2, H * .9);
  vg.addColorStop(0, '#0d1020'); vg.addColorStop(1, '#05060a'); g.fillStyle = vg; g.fillRect(0, 0, W, H);

  g.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z, H / 2 - cam.y * cam.z);
  const px = 1 / cam.z;

  // branches
  g.lineWidth = 1.2 * px; g.strokeStyle = 'rgba(140,160,220,.22)'; g.beginPath();
  for (const d of dirs.values()) { if (d.parent && d.alive) { g.moveTo(d.parent.x, d.parent.y); g.lineTo(d.x, d.y); } }
  g.stroke();

  // files
  const dotR = Math.max(2.6, 2.2 / cam.z);
  for (const f of files.values()) {
    const age = (now - f.t) / DAY;
    if (!f.alive) { const fade = (now - f.dying) / (DAY * 3); if (fade > 1) continue; g.globalAlpha = 1 - fade; }
    const [x, y] = slotPos(f.d, f.slot);
    g.fillStyle = f.color;
    g.fillRect(x - dotR / 2 - .4, y - dotR / 2 - .4, dotR + .8, dotR + .8);
    g.globalAlpha = 1;
  }
  // glows for recently touched files (pre-rendered sprites: cheap even for huge commits)
  g.globalCompositeOperation = 'lighter';
  for (const f of files.values()) {
    const age = (now - f.t) / (DAY * 2.2);
    if (age >= 1) continue;
    const [x, y] = slotPos(f.d, f.slot);
    const r = 6 + 10 * (1 - age);
    g.globalAlpha = .9 * (1 - age);
    g.drawImage(GLOW[f.kind] || GLOW[1], x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;
  // beams
  beams = beams.filter(b => now - b.t < DAY * 1.2);
  for (const b of beams) {
    const k = 1 - (now - b.t) / (DAY * 1.2);
    const [x, y] = slotPos(b.f.d, b.f.slot);
    g.strokeStyle = b.a.color; g.globalAlpha = .55 * k; g.lineWidth = 1.4 * px;
    g.beginPath(); g.moveTo(b.a.x, b.a.y); g.lineTo(x, y); g.stroke();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  // directory labels
  if (showLabels) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const d of dirs.values()) {
      if (!d.parent || !d.alive || d.depth > 2 || d.live + d.aliveKids < 3) continue;
      const fsz = (d.depth === 1 ? 15 : 12) * U * px;
      if (fsz * cam.z < 9) continue;
      g.font = `600 ${fsz}px ui-sans-serif,system-ui,sans-serif`;
      g.fillStyle = d.depth === 1 ? 'rgba(232,236,244,.85)' : 'rgba(232,236,244,.55)';
      g.fillText(d.name, d.x, d.y - d.r - 8 * px);
    }
  }

  // authors
  for (const a of authors.values()) {
    const idle = (now - a.last) / DAY;
    a.alpha += ((idle < 10 ? 1 : 0) - a.alpha) * 0.08;
    if (a.alpha < .02) continue;
    const r = 11 * U * px;
    g.globalAlpha = a.alpha;
    const halo = g.createRadialGradient(a.x, a.y, 0, a.x, a.y, r * 3);
    halo.addColorStop(0, a.color + 'aa'); halo.addColorStop(1, a.color + '00');
    g.fillStyle = halo; g.beginPath(); g.arc(a.x, a.y, r * 3, 0, TAU); g.fill();
    g.fillStyle = a.color; g.beginPath(); g.arc(a.x, a.y, r, 0, TAU); g.fill();
    g.fillStyle = '#05060a'; g.font = `800 ${r * .95}px ui-sans-serif,system-ui,sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(a.initials, a.x, a.y + r * .05);
    if (showLabels && idle < 2.5) { g.fillStyle = '#e8ecf4'; g.font = `600 ${12 * U * px}px ui-sans-serif,system-ui,sans-serif`; g.fillText(a.name, a.x, a.y + r + 11 * U * px); }
    g.globalAlpha = 1;
  }

  hud(now, U);
}

function hud(now, U){
  const W = cv.width, H = cv.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const m = 34 * U;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#e8ecf4'; g.font = `800 ${30 * U}px ui-sans-serif,system-ui,sans-serif`;
  g.fillText(D.title || D.repo, m, m + 26 * U);
  const date = new Date(Math.min(now, T1) * 1000);
  g.fillStyle = '#9aa4c4'; g.font = `600 ${18 * U}px ui-monospace,SFMono-Regular,Menlo,monospace`;
  g.fillText(date.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}), m, m + 56 * U);
  g.font = `600 ${14 * U}px ui-sans-serif,system-ui,sans-serif`; g.fillStyle = '#6f7a99';
  g.fillText(`${stats.commits.toLocaleString('en')} commits · ${stats.alive.toLocaleString('en')} files · ${authors.size} contributors`, m, m + 82 * U);

  // leaderboard
  const top = [...authors.values()].sort((a, b) => b.commits - a.commits).slice(0, 6);
  g.textAlign = 'right';
  g.fillStyle = '#6f7a99'; g.font = `700 ${12 * U}px ui-sans-serif,system-ui,sans-serif`;
  g.fillText('TOP CONTRIBUTORS', W - m, m + 10 * U);
  top.forEach((a, i) => {
    const y = m + (34 + i * 24) * U;
    g.fillStyle = a.color; g.beginPath(); g.arc(W - m - 6 * U, y - 5 * U, 5 * U, 0, TAU); g.fill();
    g.fillStyle = '#e8ecf4'; g.font = `600 ${14 * U}px ui-sans-serif,system-ui,sans-serif`;
    g.fillText(a.name.length > 22 ? a.name.slice(0, 21) + '…' : a.name, W - m - 20 * U, y);
    g.fillStyle = '#6f7a99'; g.font = `600 ${13 * U}px ui-monospace,monospace`;
    g.fillText(a.commits, W - m - 210 * U, y);
  });

  // languages legend
  const langs = [...extCount.entries()].filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 8);
  g.textAlign = 'left';
  langs.forEach(([ext, n], i) => {
    const y = H - m - 60 * U - (langs.length - 1 - i) * 20 * U;
    g.fillStyle = colorOf(ext); g.fillRect(m, y - 9 * U, 10 * U, 10 * U);
    g.fillStyle = '#9aa4c4'; g.font = `600 ${13 * U}px ui-monospace,monospace`;
    g.fillText(`.${ext}  ${n}`, m + 18 * U, y);
  });

  // progress line + watermark
  const p = (Math.min(now, T1) - T0) / Math.max(1, T1 - T0);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, H - 4 * U, W, 4 * U);
  const lg = g.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, '#7c5cff'); lg.addColorStop(1, '#26d7ff');
  g.fillStyle = lg; g.fillRect(0, H - 4 * U, W * p, 4 * U);
  g.textAlign = 'right'; g.fillStyle = 'rgba(232,236,244,.35)'; g.font = `600 ${12 * U}px ui-sans-serif,system-ui,sans-serif`;
  g.fillText('made with git-cinema', W - m, H - m + 6 * U);

  // title & end cards
  const intro = wall - startWall;
  if (ci === 0 || intro < 2.5) {
    const a = ci === 0 ? 1 : Math.max(0, 1 - (intro - 1.5));
    if (a > 0) card(a, D.title || D.repo, `${new Date(T0 * 1000).getFullYear()} → ${new Date(T1 * 1000).getFullYear()} · ${D.commits.length.toLocaleString('en')} commits`, U);
  }
  if (finished) card(Math.min(1, (wall - finishedAt) / 1.2) * .92, `${stats.commits.toLocaleString('en')} commits`,
    `${authors.size} contributors · ${stats.alive.toLocaleString('en')} files today`, U);
}
function card(alpha, title, sub, U){
  const W = cv.width, H = cv.height;
  g.globalAlpha = alpha * .75; g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H); g.globalAlpha = alpha;
  g.textAlign = 'center'; g.fillStyle = '#e8ecf4'; g.font = `800 ${64 * U}px ui-sans-serif,system-ui,sans-serif`;
  g.fillText(title, W / 2, H / 2);
  g.fillStyle = '#9aa4c4'; g.font = `600 ${22 * U}px ui-sans-serif,system-ui,sans-serif`; g.fillText(sub, W / 2, H / 2 + 44 * U);
  g.fillStyle = '#6f7a99'; g.font = `600 ${15 * U}px ui-sans-serif,system-ui,sans-serif`; g.fillText('a git-cinema film', W / 2, H / 2 - 70 * U);
  g.globalAlpha = 1;
}

/* ---------------- time ---------------- */
// Default pacing: the whole history plays in ~80 s, long idle gaps are skipped.
const span = Math.max(DAY, T1 - T0);
const BASE_RATE = Math.max(DAY / 8, span / 80);   // seconds of history per real second
let speed = 1, playing = true, wall = 0, startWall = 0, last = performance.now(), finished = false, finishedAt = 0;

function step(dt){
  if (!playing || finished) return;
  const rate = BASE_RATE * speed;
  simT += rate * dt;
  // skip silence: jump ahead when nothing happens for a while
  if (ci < D.commits.length && D.commits[ci][0] - simT > rate * 1.5) simT = D.commits[ci][0] - rate * 0.25;
  while (ci < D.commits.length && D.commits[ci][0] <= simT) applyCommit(D.commits[ci++], D.commits[ci - 1][0]);
  if (ci >= D.commits.length && simT > T1 + rate * 2.5) { finished = true; finishedAt = wall; onFinish(); }
}

function seek(frac){
  const target = T0 + frac * (T1 - T0);
  reset();
  simT = target;
  while (ci < D.commits.length && D.commits[ci][0] <= target) applyCommit(D.commits[ci++], D.commits[ci - 1][0]);
  for (let i = 0; i < 240; i++) physics(1 / 60);         // settle the layout instantly
  beams = [];
  finished = false; startWall = wall - 10;
  updateCamera(10);
}

function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t; wall += dt;
  step(dt);
  physics(dt);
  updateCamera(dt);
  render(Math.min(simT, T1 + DAY * 3));
  ui();
  requestAnimationFrame(frame);
}

/* ---------------- canvas size ---------------- */
let fixedRes = null;
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const [w, h] = fixedRes || [Math.round(innerWidth * dpr), Math.round(innerHeight * dpr)];
  cv.width = w; cv.height = h;
}
addEventListener('resize', resize);

/* ---------------- controls ---------------- */
const $ = id => document.getElementById(id);
function ui(){
  const p = Math.max(0, Math.min(1, (Math.min(simT, T1) - T0) / Math.max(1, T1 - T0)));
  $('fill').style.width = p * 100 + '%'; $('knob').style.left = p * 100 + '%';
  $('play').textContent = playing && !finished ? '⏸' : '▶';
}
function togglePlay(){ if (finished) { seek(0); playing = true; startWall = wall; return; } playing = !playing; }
$('play').onclick = togglePlay;
$('speed').onchange = e => speed = +e.target.value;
$('labels').onclick = () => showLabels = !showLabels;
$('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); playing = true; };
$('snap').onclick = snapshot;
function snapshot(){
  const a = document.createElement('a'); a.download = `${D.repo}-git-cinema.png`; a.href = cv.toDataURL('image/png'); a.click();
}
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const p = (simT - T0) / Math.max(1, T1 - T0) + (e.key === 'ArrowRight' ? .05 : -.05);
    seek(Math.max(0, Math.min(1, p)));
  }
  else if (e.key === '+' || e.key === '=') { const s = $('speed'); s.selectedIndex = Math.min(s.options.length - 1, s.selectedIndex + 1); speed = +s.value; }
  else if (e.key === '-') { const s = $('speed'); s.selectedIndex = Math.max(0, s.selectedIndex - 1); speed = +s.value; }
  else if (e.key.toLowerCase() === 'l') showLabels = !showLabels;
  else if (e.key.toLowerCase() === 's') snapshot();
});
let hideT = null;
addEventListener('mousemove', () => { $('ui').classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => recorder || $('ui').classList.add('hide'), 2500); });

/* ---------------- recording ---------------- */
let recorder = null, chunks = [];
$('record').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!cv.captureStream || !window.MediaRecorder) return flash('Recording is not supported in this browser. Try Chrome, Edge or Firefox.');
  // MP4 first: it uploads straight to X / LinkedIn. Falls back to WebM.
  const type = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t));
  if (!type) return flash('No supported video format in this browser.');
  fixedRes = [1920, 1080]; resize();
  seek(0); startWall = wall; playing = true;
  chunks = [];
  recorder = new MediaRecorder(cv.captureStream(60), {mimeType: type, videoBitsPerSecond: 12e6});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, {type: type.split(';')[0]});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${D.repo}-git-cinema.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    recorder = null; fixedRes = null; resize();
    $('record').textContent = '● Record 1080p'; $('record').classList.remove('rec');
  };
  recorder.start(1000);
  $('record').textContent = '■ Stop & save'; $('record').classList.add('rec');
};
function onFinish(){ if (recorder) setTimeout(() => recorder && recorder.stop(), 3000); }
function flash(msg){ const m = $('msg'); m.textContent = msg; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 4000); }

/* ---------------- go ---------------- */
document.title = `${D.title || D.repo} · git-cinema`;
resize(); reset();
if (!D.commits.length) { playing = false; flash('No commits in this range.'); }
const params = new URLSearchParams(location.search);
if (params.has('speed')) speed = +params.get('speed') || 1;
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
window.__gitCinema = {get stats(){ return {...stats, dirs: dirs.size, authors: authors.size, ci, finished}; }, seek};
</script>
</body>
